name: Update Profile README

# weekly schedule disabled: github models was retired on 2026-07-30, profile texts
# are now generated locally via the profile-text skill into profile-texts.json.
# this workflow only refreshes repo data (languages, commits, readmes) on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/generate-profile.sh
          bash scripts/generate-profile.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md repos.json readmes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile README and repos.json

          Auto-generated by GitHub Actions"
            git push
          fi
